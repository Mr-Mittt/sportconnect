# Chat service CI — build + vet + test for the Go chat service (CHAT-5).
#
# Deliberately scoped to services/chat/** only, mirroring server-ci.yml and
# client-ci.yml's per-artifact separation — this workflow never touches
# modules/ or client/.
#
# Unlike server-ci.yml (H2 + Testcontainers), this service's new DB-backed
# repository/cache tests (internal/conversation, internal/message,
# internal/sync) need a real Postgres reachable over the actual wire
# protocol: this service's only driver is pgx, which speaks Postgres
# natively and has no JDBC/H2 equivalent to fall back to (see
# services/chat/docs/MVP/CHAT-5_REPOSITORY_CACHE_INTEGRATION_TESTS.md). A
# postgres service container plus golang-migrate provides that real
# database, matching the same sportconnect_chat_dev name/schema the local
# dev compose stack seeds.
#
# CHAT-6 added Redis-backed sync-consumer resilience tests (internal/sync's XREADGROUP-based
# tests) — a redis service container provides that, same "real infra, not a mock" posture as
# Postgres above. Those tests use a throwaway stream/consumer-group name each, never the real
# StreamName/ConsumerGroup, so they can't collide with anything else on this container.
#
# One CHAT-6 test (TestBootstrapper_UsersPagination_FollowsNextCursorAcrossPages) needs the real
# Java monolith running too — deliberately NOT spun up here (a full Gradle+JVM+second-Postgres
# stack is too heavy for this Go-only job just for one test). That test SKIPs itself (not fails)
# whenever INTERNAL_SERVICE_SECRET isn't set, which this workflow never sets — see
# services/chat/docs/CHAT-6_*.md and the test's own comments.

name: chat-ci

on:
  push:
    branches: [master]
    paths:
      - 'services/chat/**'
      - '.github/workflows/chat-ci.yml'
  pull_request:
    paths:
      - 'services/chat/**'
      - '.github/workflows/chat-ci.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/chat

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sportconnect_chat_dev
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: sa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CHAT_DATABASE_URL: postgres://postgres:sa@localhost:5432/sportconnect_chat_dev
      REDIS_ADDR: localhost:6379
      # Only needed to mint/verify tokens inside the WebSocket broadcast test itself (CHAT-6) —
      # that test never talks to a real monolith, so this never has to match a real secret, just
      # be consistent between the token this job's own test mints and the Verifier it constructs.
      JWT_SECRET: chat-ci-test-secret-not-used-outside-this-workflow

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/chat/go.mod
          cache-dependency-path: services/chat/go.sum

      - name: Add go install's bin dir to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install golang-migrate (postgres driver only)
        run: go install -tags 'postgres' github.com/golang-migrate/migrate/v4/cmd/migrate@latest

      - name: Apply migrations
        run: migrate -path migrations -database "${CHAT_DATABASE_URL}?sslmode=disable" up

      - run: go build ./...

      - run: go vet ./...

      - run: go test ./... -v
