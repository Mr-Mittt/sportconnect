# Promote — points the `prod` tag of one image at a chosen release or build (INFRA-6). The box deploys what `prod` points
# at when its owner runs `sportconnect-deploy` (infra/oracle/scripts/sportconnect-deploy.sh); nothing here touches the box.
#
#   Actions -> promote -> Run workflow: component (server, client or chat) and version (X.Y.Z or sha-<hex>)
#
#   job `check`    no approval needed. Reads the image `prod` points at now and the one asked for, checks that the new
#                  image exists, is not older than the current one (down-version promotes are blocked until INFRA-17) and
#                  that the CI of that code did not fail, and writes the summary the reviewer reads (infra/scripts/promote-check.sh).
#   job `promote`  waits for the required reviewer of the `production` Environment, then retags the image as `prod`
#                  (infra/scripts/promote-apply.sh): the same image by digest, nothing is rebuilt.
#
# `edge`, `latest` and `prod` itself can never be promoted. Only runs from `master`.
# Setup (once, in the repository settings, see the deployment guide): Environment `production` with the owner as required
# reviewer, deployment branches limited to `master`. Verified only on GitHub after merge (INFRA-15 style): the approval
# gate, the registry reads and the retag.

name: promote
run-name: Promote ${{ inputs.component }} ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Which image'
        type: choice
        options: [server, client, chat]
        required: true
      version:
        description: 'Release X.Y.Z or build sha-<hex> (never edge, latest or prod)'
        type: string
        required: true
      skip_ci_check:
        description: 'Promote even if the CI of this code FAILED (written into the summary)'
        type: boolean
        default: false

concurrency:
  group: promote-${{ inputs.component }}
  cancel-in-progress: false   # never abandon a retag half way

permissions:
  contents: read
  actions: read     # the CI runs of the commit
  packages: write   # the retag

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.check.outputs.image }}
      new_digest: ${{ steps.check.outputs.new_digest }}
      current_version: ${{ steps.check.outputs.current_version }}
      new_version: ${{ steps.check.outputs.new_version }}
      nochange: ${{ steps.check.outputs.nochange }}
    steps:
      - name: Only from master
        run: |
          if [ "${{ github.ref }}" != "refs/heads/master" ]; then
            echo "promote runs from master only (this run is on ${{ github.ref }}); choose master under 'Use workflow from'" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the order of two commits and the CI runs before the image's commit

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Checks and summary
        id: check
        env:
          COMPONENT: ${{ inputs.component }}
          VERSION: ${{ inputs.version }}
          SKIP_CI_CHECK: ${{ inputs.skip_ci_check }}
          OWNER: ${{ github.repository_owner }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: infra/scripts/promote-check.sh

  promote:
    needs: check
    if: needs.check.outputs.nochange != 'true'
    # shown while the run waits for the reviewer
    name: Retag ${{ inputs.component }} ${{ needs.check.outputs.current_version }} -> ${{ needs.check.outputs.new_version }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Move prod
        env:
          IMAGE: ${{ needs.check.outputs.image }}
          NEW_DIGEST: ${{ needs.check.outputs.new_digest }}
        run: infra/scripts/promote-apply.sh
