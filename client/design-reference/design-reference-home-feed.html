<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SportHub - home feed design reference (do not implement from this file directly, treat as visual baseline)</title>
<!-- Icon font vendored locally (HF-10a) so this file renders identically offline/in CI.
     The original CDN URL (jsdelivr @tabler/icons-webfont@2.47.0/dist/...) was a 404 —
     same font version, now actually loading. Only this line differs from the approved mockup. -->
<link rel="stylesheet" href="./assets/tabler/tabler-icons.min.css">
<style>
  :root {
    --surface-0: #f7f7f4;
    --surface-1: #f1efe8;
    --surface-2: #ffffff;
    --text-primary: #1a1a18;
    --text-secondary: #5f5e5a;
    --text-muted: #6e6d66; /* darkened from #888780 for WCAG AA (HF-8) */
    --border: rgba(44,44,42,0.12);
    --border-strong: rgba(44,44,42,0.24);
    --border-accent: #378ADD;
    --bg-accent: #E6F1FB;
    --text-accent: #185FA5;
    --text-danger: #A32D2D;

    --teal-50: #E1F5EE;   --teal-800: #085041;
    --coral-50: #FAECE7;  --coral-800: #712B13;
    --purple-50: #EEEDFE; --purple-800: #3C3489;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--surface-0);
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
    display: flex;
    justify-content: center;
    padding: 32px 16px;
  }
  #frame { width: 960px; max-width: 100%; }
  button { font-family: inherit; }
  .note {
    max-width: 960px;
    margin: 0 auto 20px;
    font-size: 13px;
    color: var(--text-secondary);
    background: var(--surface-1);
    border: 0.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
  }
</style>
</head>
<body>
<div style="width:100%;">
<div class="note">Reference only. This is the approved home feed mockup, frozen as a static baseline for visual QA (HF-10) — not production code. Open at 375px, 768px, and 1280px viewport widths to compare against the built React implementation.</div>
<div id="frame">
<div style="padding: 1rem 0;">

<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
  <div style="font-size:18px;font-weight:500;color:var(--text-primary);">SportHub</div>
  <div style="display:flex;align-items:center;gap:14px;">
    <i class="ti ti-search" style="font-size:19px;color:var(--text-secondary);" aria-hidden="true"></i>
    <i class="ti ti-bell" style="font-size:19px;color:var(--text-secondary);" aria-hidden="true"></i>
    <div style="width:28px;height:28px;border-radius:50%;background:var(--bg-accent);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text-accent);">BN</div>
  </div>
</div>

<div style="display:flex;gap:6px;border-bottom:0.5px solid var(--border);padding-bottom:8px;margin-bottom:14px;">
  <button data-nav="home" class="nav-btn" style="border:none;background:none;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-primary);font-weight:500;padding:6px 8px;border-radius:8px;cursor:pointer;"><i class="ti ti-home" style="font-size:16px;" aria-hidden="true"></i>Home</button>
  <button data-nav="friends" class="nav-btn" style="border:none;background:none;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-secondary);padding:6px 8px;border-radius:8px;cursor:pointer;"><i class="ti ti-users" style="font-size:16px;" aria-hidden="true"></i>Friends</button>
  <button data-nav="groups" class="nav-btn" style="border:none;background:none;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-secondary);padding:6px 8px;border-radius:8px;cursor:pointer;"><i class="ti ti-users-group" style="font-size:16px;" aria-hidden="true"></i>Groups</button>
  <button data-nav="matches" class="nav-btn" style="border:none;background:none;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-secondary);padding:6px 8px;border-radius:8px;cursor:pointer;"><i class="ti ti-calendar-event" style="font-size:16px;" aria-hidden="true"></i>Matches</button>
  <button data-nav="profile" class="nav-btn" style="border:none;background:none;display:flex;align-items:center;gap:5px;font-size:13px;color:var(--text-secondary);padding:6px 8px;border-radius:8px;cursor:pointer;"><i class="ti ti-user" style="font-size:16px;" aria-hidden="true"></i>Profile</button>
</div>

<div id="sport-switcher" style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;"></div>

<div style="display:grid;grid-template-columns:1.6fr 1fr;gap:14px;">
  <div id="feed" style="min-width:0;display:flex;flex-direction:column;gap:10px;"></div>
  <div style="min-width:0;display:flex;flex-direction:column;gap:14px;">
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px;">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="font-size:13px;font-weight:500;color:var(--text-primary);">Upcoming</div>
        <button data-nav-inline="matches" style="border:none;background:none;font-size:12px;color:var(--text-accent);cursor:pointer;padding:0;">See all</button>
      </div>
      <div id="upcoming" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px;">
      <div style="font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:10px;">Trending</div>
      <div id="hashtags" style="display:flex;flex-direction:column;gap:8px;"></div>
    </div>
    <div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px;">
      <div style="font-size:13px;font-weight:500;color:var(--text-primary);margin-bottom:10px;">Group broadcasts</div>
      <div id="broadcasts" style="display:flex;flex-direction:column;gap:10px;"></div>
    </div>
  </div>
</div>
</div>
</div>
</div>

<script>
function sendPrompt(msg) { console.log('[sendPrompt]', msg); }

var sports = [
  { key: 'all', label: 'All', icon: 'ti-layout-grid', ramp: 'gray' },
  { key: 'football', label: 'Football', icon: 'ti-ball-football', ramp: 'teal' },
  { key: 'basketball', label: 'Basketball', icon: 'ti-ball-basketball', ramp: 'coral' },
  { key: 'tennis', label: 'Tennis', icon: 'ti-ball-tennis', ramp: 'purple' }
];

var posts = [
  { sport: 'football', name: 'Marcus Lee', init: 'ML', time: '2h', text: 'Great 5-a-side session tonight, 3 wins in a row for the squad.', tags: ['#5aside', '#fridayrun'], likes: 14, comments: 3 },
  { sport: 'basketball', name: 'Priya Shah', init: 'PS', time: '4h', text: 'Looking for 2 more players for Sunday pickup at Riverside courts.', tags: ['#pickup', '#riverside'], likes: 9, comments: 6 },
  { sport: 'tennis', name: 'Diego Alvarez', init: 'DA', time: '6h', text: 'New PB on serve speed this week. Coach says footwork is finally clicking.', tags: ['#tennislife'], likes: 21, comments: 2 },
  { sport: 'football', name: 'Hana Kim', init: 'HK', time: '1d', text: 'Our clan is hosting a mini tournament next Saturday, open to all levels.', tags: ['#tournament', '#openclan'], likes: 32, comments: 11 }
];

var upcoming = [
  { sport: 'football', ramp: 'teal', icon: 'ti-ball-football', title: 'FC Weekend Warriors vs Riverside FC', when: 'Tomorrow, 7:00 PM', where: 'Central Turf Park', spots: 2 },
  { sport: 'basketball', ramp: 'coral', icon: 'ti-ball-basketball', title: 'Sunday pickup run', when: 'Sun, 9:00 AM', where: 'Riverside Courts', spots: 4 },
  { sport: 'tennis', ramp: 'purple', icon: 'ti-ball-tennis', title: 'Singles ladder match vs D. Alvarez', when: 'Wed, 6:30 PM', where: 'Greenwood Club', spots: 0 }
];

var hashtags = [
  { tag: '#fridayrun', count: 128 },
  { tag: '#tournament', count: 94 },
  { tag: '#pickup', count: 61 },
  { tag: '#tennislife', count: 47 }
];

var broadcasts = [
  { group: 'Riverside Ballers', init: 'RB', ramp: 'coral', text: 'Court booking confirmed for Sunday 9am, see you there.', time: '1h' },
  { group: 'FC Weekend Warriors', init: 'FW', ramp: 'teal', text: 'Tournament bracket is posted, check the schedule tab.', time: '5h' }
];

var likeState = {};
posts.forEach(function(p, i) { likeState[i] = { liked: false, count: p.likes }; });

var activeSport = 'all';

function renderSwitcher() {
  var el = document.getElementById('sport-switcher');
  el.innerHTML = sports.map(function(s) {
    var isActive = s.key === activeSport;
    return '<button data-sport="' + s.key + '" style="border:' + (isActive ? '2px solid var(--border-accent)' : '0.5px solid var(--border)') + ';background:var(--surface-1);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:' + (isActive ? '500' : '400') + ';color:var(--text-primary);padding:7px 12px;border-radius:20px;cursor:pointer;">' +
      '<i class="ti ' + s.icon + '" style="font-size:15px;" aria-hidden="true"></i>' + s.label + '</button>';
  }).join('') + '<button data-sport="__add" style="border:0.5px dashed var(--border-strong);background:none;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-secondary);padding:7px 12px;border-radius:20px;cursor:pointer;"><i class="ti ti-plus" style="font-size:15px;" aria-hidden="true"></i>Add sport</button>';

  el.querySelectorAll('button').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var key = btn.getAttribute('data-sport');
      if (key === '__add') { sendPrompt('I want to add a new sport profile to my account'); return; }
      activeSport = key;
      renderSwitcher();
      renderFeed();
      renderUpcoming();
    });
  });
}

function renderFeed() {
  var el = document.getElementById('feed');
  var filtered = posts.map(function(p, i) { return { p: p, i: i }; }).filter(function(x) {
    return activeSport === 'all' || x.p.sport === activeSport;
  });
  if (filtered.length === 0) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:13px;padding:24px 0;text-align:center;">No posts yet for this sport.</div>';
    return;
  }
  el.innerHTML = filtered.map(function(x) {
    var p = x.p, i = x.i;
    var sportInfo = sports.find(function(s) { return s.key === p.sport; });
    var st = likeState[i];
    return '<div style="background:var(--surface-2);border:0.5px solid var(--border);border-radius:12px;padding:14px;">' +
      '<div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">' +
      '<div style="width:36px;height:36px;border-radius:50%;background:var(--surface-1);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--text-primary);">' + p.init + '</div>' +
      '<div style="flex:1;">' +
      '<div style="font-size:14px;font-weight:500;color:var(--text-primary);">' + p.name + '</div>' +
      '<div style="font-size:12px;color:var(--text-muted);">' + p.time + ' ago</div>' +
      '</div>' +
      '<span style="background:var(--' + sportInfo.ramp + '-50, var(--surface-1));color:var(--' + sportInfo.ramp + '-800, var(--text-primary));font-size:11px;padding:3px 9px;border-radius:20px;display:flex;align-items:center;gap:4px;">' +
      '<i class="ti ' + sportInfo.icon + '" style="font-size:12px;" aria-hidden="true"></i>' + sportInfo.label + '</span>' +
      '</div>' +
      '<div style="font-size:14px;color:var(--text-primary);line-height:1.5;margin-bottom:8px;">' + p.text + '</div>' +
      '<div style="display:flex;gap:6px;margin-bottom:10px;">' + p.tags.map(function(t) { return '<span style="font-size:12px;color:var(--text-accent);">' + t + '</span>'; }).join('') + '</div>' +
      '<div style="display:flex;gap:16px;border-top:0.5px solid var(--border);padding-top:8px;">' +
      '<button data-like="' + i + '" style="border:none;background:none;display:flex;align-items:center;gap:5px;font-size:12px;color:' + (st.liked ? 'var(--text-danger)' : 'var(--text-secondary)') + ';cursor:pointer;padding:2px;"><i class="ti ti-heart' + (st.liked ? '-filled' : '') + '" style="font-size:15px;" aria-hidden="true"></i>' + st.count + '</button>' +
      '<span style="display:flex;align-items:center;gap:5px;font-size:12px;color:var(--text-secondary);"><i class="ti ti-message-circle" style="font-size:15px;" aria-hidden="true"></i>' + p.comments + '</span>' +
      '</div></div>';
  }).join('');

  el.querySelectorAll('[data-like]').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var i = btn.getAttribute('data-like');
      likeState[i].liked = !likeState[i].liked;
      likeState[i].count += likeState[i].liked ? 1 : -1;
      renderFeed();
    });
  });
}

function renderUpcoming() {
  var el = document.getElementById('upcoming');
  var filtered = upcoming.filter(function(u) { return activeSport === 'all' || u.sport === activeSport; });
  if (filtered.length === 0) {
    el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:8px 0;">No upcoming matches for this sport.</div>';
    return;
  }
  el.innerHTML = filtered.map(function(u, i) {
    var full = u.spots === 0;
    return '<div style="border:0.5px solid var(--border);border-radius:8px;padding:10px;">' +
      '<div style="display:flex;align-items:center;gap:6px;margin-bottom:5px;">' +
      '<span style="width:22px;height:22px;border-radius:50%;background:var(--' + u.ramp + '-50);color:var(--' + u.ramp + '-800);display:flex;align-items:center;justify-content:center;flex-shrink:0;"><i class="ti ' + u.icon + '" style="font-size:12px;" aria-hidden="true"></i></span>' +
      '<div style="font-size:12px;font-weight:500;color:var(--text-primary);line-height:1.3;">' + u.title + '</div>' +
      '</div>' +
      '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:2px;"><i class="ti ti-clock" style="font-size:12px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>' + u.when + '</div>' +
      '<div style="font-size:11px;color:var(--text-secondary);margin-bottom:8px;"><i class="ti ti-map-pin" style="font-size:12px;vertical-align:-2px;margin-right:4px;" aria-hidden="true"></i>' + u.where + '</div>' +
      '<button data-rsvp="' + i + '" style="width:100%;border:0.5px solid var(--border-strong);background:none;font-size:12px;color:' + (full ? 'var(--text-muted)' : 'var(--text-primary)') + ';padding:5px;border-radius:8px;cursor:pointer;">' + (full ? 'Full, view details' : u.spots + ' spots left, join') + '</button>' +
      '</div>';
  }).join('');

  el.querySelectorAll('[data-rsvp]').forEach(function(btn) {
    btn.addEventListener('click', function() { sendPrompt('Show me details for this upcoming match and let me join or view it'); });
  });
}

function renderHashtags() {
  var el = document.getElementById('hashtags');
  el.innerHTML = hashtags.map(function(h) {
    return '<button data-tag="' + h.tag + '" style="border:none;background:none;display:flex;align-items:center;justify-content:space-between;padding:0;cursor:pointer;text-align:left;">' +
      '<span style="font-size:13px;color:var(--text-accent);">' + h.tag + '</span>' +
      '<span style="font-size:12px;color:var(--text-muted);">' + h.count + ' posts</span>' +
      '</button>';
  }).join('');
  el.querySelectorAll('button').forEach(function(btn) {
    btn.addEventListener('click', function() { sendPrompt('Show me posts tagged ' + btn.getAttribute('data-tag')); });
  });
}

function renderBroadcasts() {
  var el = document.getElementById('broadcasts');
  el.innerHTML = broadcasts.map(function(b) {
    return '<div style="display:flex;gap:9px;">' +
      '<div style="width:30px;height:30px;flex-shrink:0;border-radius:50%;background:var(--' + b.ramp + '-50);color:var(--' + b.ramp + '-800);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;">' + b.init + '</div>' +
      '<div style="min-width:0;">' +
      '<div style="font-size:12px;font-weight:500;color:var(--text-primary);">' + b.group + ' <span style="font-weight:400;color:var(--text-muted);">' + b.time + '</span></div>' +
      '<div style="font-size:12px;color:var(--text-secondary);line-height:1.4;">' + b.text + '</div>' +
      '</div></div>';
  }).join('');
}

document.querySelectorAll('.nav-btn, [data-nav-inline]').forEach(function(btn) {
  btn.addEventListener('click', function() {
    var section = btn.getAttribute('data-nav') || btn.getAttribute('data-nav-inline');
    if (section === 'home') return;
    var labels = { friends: 'find friends by sport', groups: 'find or manage a group', matches: 'find or create a match', profile: 'view and edit my profile' };
    sendPrompt('Show me the ' + section + ' screen to ' + labels[section]);
  });
});

renderSwitcher();
renderFeed();
renderUpcoming();
renderHashtags();
renderBroadcasts();
</script>
</body>
</html>
