pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = 'fullstack-app'

// Modules organized under modules directory
include 'server'
include 'modules:common'
include 'modules:auth:auth-api'
include 'modules:auth:auth-impl'
include 'modules:user:user-api'
include 'modules:user:user-impl'
include 'modules:sport:sport-api'
include 'modules:sport:sport-impl'
include 'modules:social:post-api'
include 'modules:social:post-impl'
include 'modules:social:group-api'
include 'modules:social:group-impl'
include 'modules:location:location-api'
include 'modules:location:location-impl'
include 'modules:session:session-api'
include 'modules:session:session-impl'
include 'modules:notification:notification-api'
include 'modules:notification:notification-impl'

// Frontend (pnpm/Vite project wrapped by the node-gradle plugin)
include 'client'
