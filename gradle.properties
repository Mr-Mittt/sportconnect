# The one monolith version (INFRA-4). Every Gradle project, the server jar, /actuator/info and the image labels read it.
# Do not edit by hand: infra/scripts/server-version.sh bump [minor|patch|major|X.Y.Z] raises it (default minor) and checks it
# against the released tags. Merging a PR that raises it RELEASES that version (.github/workflows/server-image.yml).
# 0.0.0 is the placeholder before the first release and is never released.
# CI stamps ordinary builds as <version>+<short sha> through -Pversion.
version=0.1.0
