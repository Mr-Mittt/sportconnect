# Development Profile Configuration
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/sportconnect_dev
    username: postgres
    password: sa
  
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  
  data:
    redis:
      host: localhost
      port: 6379
      password: ""

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# Development Server
server:
  port: 8080

# Actuator — dev-only: full health breakdown (never expose show-details:
# always in a real environment, it can leak internal component details to
# an unauthenticated caller). Mail is excluded from the aggregate health
# status — no real SMTP credentials are configured for local dev, so that
# check always fails regardless of whether the app itself is healthy; DB/
# Redis/disk (the dependencies dev actually relies on) still drive the
# overall status.
management:
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# Development Logging
logging:
  level:
    root: INFO
    com.sportconnect: DEBUG
    org.springframework.web: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# Development JWT (shorter expiration for testing)
app:
  jwt:
    secret: dev-secret-key-for-development-only-change-in-production-min-256-bits
    expiration: 3600000 # 1 hour
    refresh-expiration: 86400000 # 1 day
  cookie:
    secure: false # Vite (:5173) -> API (:8080) over plain HTTP locally
  # Dev-only literal, same treatment as jwt.secret above — application-prod.yml still requires
  # the real INTERNAL_SERVICE_SECRET env var with no default. Must match services/chat/.env's
  # INTERNAL_SERVICE_SECRET (see services/chat/docs/SYNC_DESIGN.md) so the chat service's
  # cold-start bootstrap pull against /internal/sync/** authenticates locally without either
  # side needing this exported by hand.
  internal-service-secret: some-shared-dev-secret
