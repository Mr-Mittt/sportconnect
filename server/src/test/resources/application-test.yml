app:
  # SecurityConfig's beans are created regardless of the SecurityAutoConfiguration exclusion
  # below (it's application code, not Boot autoconfiguration) — app.internal-service-secret has
  # no default in application.yml on purpose (see its comment there), so the test profile needs
  # its own value or context startup fails resolving the placeholder.
  internal-service-secret: test-internal-service-secret
  location:
    geo-backfill:
      # LOC-5: off so a context start never forces the boundary index to load; the IT invokes the runner directly
      enabled: false
  session:
    generation:
      # SESSION-GROUP-5: the ITs drain the generation queue on the calling thread and keep the 60-second tick out of the way.
      async: false
      safety-net: false
  stats:
    job:
      # SESSION-53: the ITs call the runner directly and keep the 5-minute tick (and its worker thread) out of the way.
      enabled: false
      async: false
    ranking:
      # SESSION-54: the ITs call the ranker directly and keep the nightly and retry ticks (and the worker thread) out of the way.
      enabled: false
      async: false

spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
  
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        default_schema: public
  
  liquibase:
    enabled: false

  security:
    enabled: false
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging:
  level:
    com.sportconnect: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.tool.schema: DEBUG
    org.hibernate.engine.jdbc.env.internal: DEBUG
    org.springframework.orm.jpa: DEBUG
