plugins {
    id 'java'
    id 'groovy'
    id 'org.springframework.boot' version '3.2.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.sportconnect'
version = '0.0.1-SNAPSHOT'

java {
    sourceCompatibility = '21'
    targetCompatibility = '21'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Module dependencies
    implementation project(':modules:auth:auth-impl')
    implementation project(':modules:user:user-impl')
    implementation project(':modules:sport:sport-impl')
    implementation project(':modules:social:post-impl')
    implementation project(':modules:social:post-api')
    implementation project(':modules:social:group-impl')
    implementation project(':modules:social:group-api')
    implementation project(':modules:location:location-impl')
    implementation project(':modules:location:location-api')
    implementation project(':modules:session:session-impl')
    implementation project(':modules:session:session-api')
    implementation project(':modules:notification:notification-impl')
    implementation project(':modules:notification:notification-api')
    implementation project(':modules:common')
    
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    
    // Database
    implementation 'org.liquibase:liquibase-core'
    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'com.h2database:h2'
    
    // Spatial/Geometry support (JTS)
    implementation 'org.locationtech.jts:jts-core:1.19.0'
    implementation 'org.hibernate.orm:hibernate-spatial:6.4.0.Final'
    
    // Jackson for Java 8 date/time
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    
    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    
    // Utilities
    implementation 'org.apache.commons:commons-lang3:3.14.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // API Documentation
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0'
    
    // Testing - Spock Framework
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'org.testcontainers:testcontainers:2.0.5'

    // Only transitively available at runtime (declared 'implementation', not 'api', by common/
    // session-impl/notification-impl) — needed here at compile time for RabbitTemplate in
    // SessionEventsConsumerIntegrationTest.
    testImplementation 'org.springframework.boot:spring-boot-starter-amqp'

    // Only transitively available at runtime (declared 'implementation', not 'api', by auth-impl) —
    // needed here at compile time for JwtTokenService, used to mint a real access token in
    // NotificationStompIntegrationTest (NTF-3).
    testImplementation project(':modules:auth:auth-api')

    // Same situation, via sport-impl — needed here at compile time for the SportAttributeSchema DTO
    // tree built in SportAttributeSchemaIntegrationTest (A9). Unlike the other domains, sport-api is
    // not declared for the main source set above, so it is test-only.
    testImplementation project(':modules:sport:sport-api')

    // Same situation, via user-impl — needed here at compile time for the UserService interface
    // UserServiceImpl implements, called directly (not through MockMvc) to exercise the real
    // deactivation path in UserDeactivationSessionRevocationIntegrationTest (U12).
    testImplementation project(':modules:user:user-api')

    // Polling assertions for async @RabbitListener processing (NTF-2's real-RabbitMQ IT test) —
    // a message is consumed on a background listener thread, not the test's calling thread.
    testImplementation 'org.awaitility:awaitility:4.2.2'

    // Spock Framework
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
    
    // Mockito for Spock (optional, for Java mocking)
    testImplementation 'org.mockito:mockito-core:5.7.0'
    
    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'
}

tasks.named('test') {
    useJUnitPlatform()
    systemProperty 'spring.profiles.active', 'test'
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

bootJar {
    archiveFileName = 'server.jar'
}

bootRun {
    args = []
    systemProperties = System.properties
}
