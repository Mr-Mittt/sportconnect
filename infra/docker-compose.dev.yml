name: sportconnect-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sportconnect_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sa
    ports:
      - "5432:5432"
    volumes:
      - sportconnect_dev_postgres:/var/lib/postgresql/data
      # Seeds services/chat's own dev database (sportconnect_chat_dev) on this same instance —
      # only runs on first volume creation, see infra/scripts/init-chat-db.sql.
      - ./scripts/init-chat-db.sql:/docker-entrypoint-initdb.d/init-chat-db.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - sportconnect_dev_redis:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest/guest)
      - "8613:61613"  # STOMP (NTF-3 live delivery) — plugin enabled via enabled_plugins below.
                      # Host port is 8613, NOT 61613: on Windows, Hyper-V/WSL dynamic port
                      # reservations (range 49152–65535) can grab 61613 so Docker silently fails to
                      # bind the host side. 8613 is below 49152, so the conflict is structurally
                      # impossible. Container-internal port stays 61613; application-dev.yml sets
                      # app.stomp-relay.port: 8613 to match. See server/README.md Troubleshooting.
    volumes:
      - sportconnect_dev_rabbitmq:/var/lib/rabbitmq
      # Overrides the -management image's baked-in enabled_plugins (which only lists
      # rabbitmq_management) to also enable rabbitmq_stomp, not on by default — see NTF-3.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

volumes:
  sportconnect_dev_postgres:
  sportconnect_dev_redis:
  sportconnect_dev_rabbitmq:
