name: sportconnect-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sportconnect_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sa
    ports:
      - "5432:5432"
    volumes:
      - sportconnect_dev_postgres:/var/lib/postgresql/data
      # Seeds services/chat's own dev database (sportconnect_chat_dev) on this same instance —
      # only runs on first volume creation, see infra/scripts/init-chat-db.sql.
      - ./scripts/init-chat-db.sql:/docker-entrypoint-initdb.d/init-chat-db.sql:ro

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - sportconnect_dev_redis:/data

volumes:
  sportconnect_dev_postgres:
  sportconnect_dev_redis:
