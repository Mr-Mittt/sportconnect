name: sportconnect-dev

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sportconnect_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: sa
    ports:
      - "5432:5432"
    volumes:
      - sportconnect_dev_postgres:/var/lib/postgresql/data
      # Seeds services/chat's own dev database (sportconnect_chat_dev) on this same instance —
      # only runs on first volume creation, see infra/scripts/init-chat-db.sql.
      - ./scripts/init-chat-db.sql:/docker-entrypoint-initdb.d/init-chat-db.sql:ro
      # Creates keycloak_dev for the keycloak service below (INFRA-13). Same first-volume-creation
      # rule; on an existing volume run it once by hand, see the header of the script.
      - ./scripts/create-keycloak-db.sh:/docker-entrypoint-initdb.d/10-create-keycloak-db.sh:ro
    healthcheck:
      # keycloak waits for this - it fails at boot if the database is not accepting connections.
      test: ["CMD-SHELL", "pg_isready -U postgres -d sportconnect_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - sportconnect_dev_redis:/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI (guest/guest)
      - "8613:61613"  # STOMP (NTF-3 live delivery) — plugin enabled via enabled_plugins below.
                      # Host port is 8613, NOT 61613: on Windows, Hyper-V/WSL dynamic port
                      # reservations (range 49152–65535) can grab 61613 so Docker silently fails to
                      # bind the host side. 8613 is below 49152, so the conflict is structurally
                      # impossible. Container-internal port stays 61613; application-dev.yml sets
                      # app.stomp-relay.port: 8613 to match. See server/README.md Troubleshooting.
    volumes:
      - sportconnect_dev_rabbitmq:/var/lib/rabbitmq
      # Overrides the -management image's baked-in enabled_plugins (which only lists
      # rabbitmq_management) to also enable rabbitmq_stomp, not on by default — see NTF-3.
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro

  # Keycloak (INFRA-13): identity provider for password + Google/Facebook/Zalo sign-in, see
  # documentation/md/KEYCLOAK_SOCIAL_LOGIN_DESIGN.md. Dev mode (start-dev) on purpose - production
  # mode is INFRA-14. Host port 8081 because 8080 is the Spring backend. Realm `sportconnect` is
  # imported from infra/keycloak/realm/ only when it does not exist yet; see
  # infra/documentation/MVP/INFRA-13_KEYCLOAK_IN_COMPOSE_AND_REALM_AS_CODE.md for resetting it.
  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: ["start-dev", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_dev
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: sa
      # Pinned so the token issuer is the same wherever it is read; the dynamic back-channel flag
      # lets a provider call back to the container-internal host (A23 finding).
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin # dev-only, like rabbitmq's guest/guest
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./keycloak/realm/sportconnect-realm.json:/opt/keycloak/data/import/sportconnect-realm.json:ro
      # Theme (AUTH-15) and extension (A27) JARs go here; *.jar is git-ignored.
      - ./keycloak/providers:/opt/keycloak/providers:ro
      # Email theme (A28): the reset and verification messages, en and vi. A plain theme directory, no build step.
      - ./keycloak/themes:/opt/keycloak/themes:ro

  # Dev mail sink: Keycloak's SMTP points here, so reset/verify emails (A28) never leave the
  # machine. Read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI

volumes:
  sportconnect_dev_postgres:
  sportconnect_dev_redis:
  sportconnect_dev_rabbitmq:
