# A28: SportConnect email theme, English. MessageFormat: a literal apostrophe is written twice ('').
# Body arguments: {0} = link, {1} = expiry value, {2} = realm name, {3} = formatted expiry (e.g. "12 hours").
emailFooter=SportConnect, the sports community.
passwordResetSubject=Reset your password - SportConnect
passwordResetBody=Hello,\n\nWe received a request to reset the password of your SportConnect account.\n\nClick the link below to choose a new password:\n\n{0}\n\nThis link will expire within {3}.\n\nIf you didn''t ask for this, ignore this email and nothing will change.\n\nBest regards,\nSportConnect Team
passwordResetBodyHtml=<p>Hello,</p><p>We received a request to reset the password of your SportConnect account.</p><p><a href="{0}">Choose a new password</a></p><p>This link will expire within {3}.</p><p>If you didn''t ask for this, ignore this email and nothing will change.</p><p>Best regards,<br/>SportConnect Team</p>
emailVerificationSubject=Verify your email - SportConnect
emailVerificationBody=Welcome to SportConnect!\n\nPlease verify your email address by clicking the link below:\n\n{0}\n\nThis link will expire within {3}.\n\nIf you didn''t create an account, ignore this email.\n\nBest regards,\nSportConnect Team
emailVerificationBodyHtml=<p>Welcome to SportConnect!</p><p>Please verify your email address:</p><p><a href="{0}">Verify my email</a></p><p>This link will expire within {3}.</p><p>If you didn''t create an account, ignore this email.</p><p>Best regards,<br/>SportConnect Team</p>
# A29: the email that links a social sign-in to an existing account. {0} = provider name, {1} = realm, {2} = the provider account, {3} = link, {4} = expiry value, {5} = formatted expiry.
identityProviderLinkSubject=Link your {0} sign-in - SportConnect
identityProviderLinkBody=Hello,\n\nYou tried to sign in to SportConnect with {0} ({2}), and an account with this email already exists.\n\nIf this was you, click the link below to link {0} to your existing SportConnect account:\n\n{3}\n\nThis link will expire within {5}.\n\nIf this account''s email was never verified, clicking the link also removes the account''s current password and ends its other sessions; set a new one afterwards with "Forgot password".\n\nIf this was not you, ignore this email and nothing will change.\n\nBest regards,\nSportConnect Team
identityProviderLinkBodyHtml=<p>Hello,</p><p>You tried to sign in to SportConnect with {0} ({2}), and an account with this email already exists.</p><p>If this was you, link {0} to your existing SportConnect account:</p><p><a href="{3}">Link {0} to my account</a></p><p>This link will expire within {5}.</p><p>If this account''s email was never verified, clicking the link also removes the account''s current password and ends its other sessions; set a new one afterwards with "Forgot password".</p><p>If this was not you, ignore this email and nothing will change.</p><p>Best regards,<br/>SportConnect Team</p>
