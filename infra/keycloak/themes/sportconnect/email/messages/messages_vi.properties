identityProviderLinkBody=Xin chào,\n\nBạn vừa thử đăng nhập SportConnect bằng {0} ({2}), và đã có một tài khoản dùng email này.\n\nNếu là bạn, hãy nhấp vào liên kết bên dưới để liên kết {0} với tài khoản SportConnect hiện có:\n\n{3}\n\nLiên kết này sẽ hết hạn sau {5}.\n\nNếu email của tài khoản này chưa từng được xác minh, nhấp vào liên kết cũng sẽ xóa mật khẩu hiện tại của tài khoản và kết thúc các phiên đăng nhập khác; sau đó hãy đặt mật khẩu mới bằng "Quên mật khẩu".\n\nNếu không phải bạn, hãy bỏ qua email này, mọi thứ sẽ không thay đổi.\n\nTrân trọng,\nĐội ngũ SportConnect
