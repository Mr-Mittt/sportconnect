plugins {
    id 'groovy'
}

dependencies {
    // Module dependencies
    implementation project(':modules:location:location-api')
    implementation project(':modules:common')
    implementation project(':modules:sport:sport-api')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Spatial/Geometry support (JTS) — same versions as post-impl/user-impl
    implementation 'org.hibernate.orm:hibernate-spatial:6.4.1.Final'
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // LOC-4: offline coordinate-to-IANA-timezone lookup (bundled boundary dataset, no network
    // call) — used only by LocationTimeZoneResolver. Explicit commons-lang3 override: Spring
    // Boot's dependency management pins 3.13.0, but timeshape's commons-compress transitive
    // dependency needs 3.18.0+ (SystemProperties.getUserName(String), added after 3.13.0) —
    // without this override, Gradle's BOM-managed version silently wins over the higher version
    // commons-compress itself requests, and TimeZoneEngine.initialize() fails with
    // NoSuchMethodError at runtime.
    implementation 'net.iakovlev:timeshape:2026b.29'
    implementation 'org.apache.commons:commons-lang3:3.18.0'

    // OpenAPI/Swagger annotations for controller documentation — version matches what
    // server's springdoc-openapi-starter-webmvc-ui:2.3.0 resolves (verified, not guessed)
    compileOnly 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.19'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing - Spock Framework
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
    testImplementation 'org.mockito:mockito-core:5.7.0'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}
