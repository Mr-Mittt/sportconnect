# A10: password-reset email, English. MessageFormat syntax: a literal apostrophe is written twice ('').
# {0} = reset link, {1} = minutes the link stays valid.
subject=Reset Your Password - SportConnect
body=Hello,\n\nWe received a request to reset your password for your SportConnect account.\n\nClick the link below to reset your password:\n\n{0}\n\nThis link will expire in {1} minutes.\n\nIf you didn''t request a password reset, please ignore this email.\n\nBest regards,\nSportConnect Team
