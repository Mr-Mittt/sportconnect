body=Xin chào {0},\n\nChào mừng bạn đến với SportConnect! Email của bạn đã được xác minh thành công.\n\nBây giờ bạn có thể:\n- Tìm bạn chơi thể thao\n- Đặt sân và cơ sở vật chất\n- Chia sẻ những khoảnh khắc thể thao\n- Kết nối với cộng đồng thể thao\n\nHãy bắt đầu bằng cách hoàn thiện hồ sơ và thêm các môn thể thao yêu thích của bạn!\n\nTrân trọng,\nĐội ngũ SportConnect
