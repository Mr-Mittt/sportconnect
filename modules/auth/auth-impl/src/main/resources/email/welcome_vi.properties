# A13, A28: email chào mừng, tiếng Việt (gửi ở lần đăng nhập đầu tiên, nên không nói email đã được xác minh). {0} = tên của người dùng (hoặc "bạn" khi chưa biết).
subject=Chào mừng bạn đến với SportConnect!
body=Xin chào {0},\n\nChào mừng bạn đến với SportConnect! Tài khoản của bạn đã sẵn sàng.\n\nBây giờ bạn có thể:\n- Tìm bạn chơi thể thao\n- Đặt sân và cơ sở vật chất\n- Chia sẻ những khoảnh khắc thể thao\n- Kết nối với cộng đồng thể thao\n\nHãy bắt đầu bằng cách hoàn thiện hồ sơ và thêm các môn thể thao yêu thích của bạn!\n\nTrân trọng,\nĐội ngũ SportConnect
name.fallback=bạn
