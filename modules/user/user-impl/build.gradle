plugins {
    id 'groovy'
}

dependencies {
    // Module dependencies
    implementation project(':modules:user:user-api')
    implementation project(':modules:common')
    
    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    
    // Password encoder (for password verification)
    implementation 'org.springframework.security:spring-security-crypto'
    
    // Hibernate Spatial for PostGIS
    implementation 'org.hibernate.orm:hibernate-spatial:6.4.0.Final'
    
    // JTS for geospatial
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // OpenAPI/Swagger annotations for controller documentation — version matches what
    // server's springdoc-openapi-starter-webmvc-ui:2.3.0 resolves (verified, not guessed)
    compileOnly 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.19'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    
    // Testing
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
}

test {
    useJUnitPlatform()
}
