# U24: email mã xác nhận, tiếng Việt. {0} = mã, {1} = số phút mã còn hiệu lực.
subject=Mã xác nhận SportConnect của bạn
body.deactivate=Mã xác nhận của bạn là {0}\n\nDùng mã này để vô hiệu hóa tài khoản SportConnect của bạn. Mã có hiệu lực trong {1} phút và chỉ dùng được một lần.\n\nNếu bạn không yêu cầu, hãy bỏ qua email này, tài khoản của bạn vẫn được giữ nguyên. Hãy cân nhắc đổi mật khẩu.\n\nĐội ngũ SportConnect
body.change_password=Mã xác nhận của bạn là {0}\n\nDùng mã này để đổi mật khẩu SportConnect của bạn. Mã có hiệu lực trong {1} phút và chỉ dùng được một lần.\n\nNếu bạn không yêu cầu, hãy bỏ qua email này, mật khẩu của bạn vẫn được giữ nguyên. Hãy cân nhắc đổi mật khẩu.\n\nĐội ngũ SportConnect
