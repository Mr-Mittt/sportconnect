# U24: confirmation code email, English. {0} = the code, {1} = minutes it stays valid.
subject=Your SportConnect confirmation code
body.deactivate=Your confirmation code is {0}\n\nUse it to deactivate your SportConnect account. It is valid for {1} minutes and works once.\n\nIf you did not ask for this, ignore this email and your account stays as it is. Consider changing your password.\n\nSportConnect Team
body.change_password=Your confirmation code is {0}\n\nUse it to change your SportConnect password. It is valid for {1} minutes and works once.\n\nIf you did not ask for this, ignore this email and your password stays as it is. Consider changing it anyway.\n\nSportConnect Team
body.change_email=Your confirmation code is {0}\n\nUse it to confirm that you want to change the email address of your SportConnect account. It is valid for {1} minutes and works once.\n\nIf you did not ask for this, ignore this email and your account stays as it is. Consider changing your password.\n\nSportConnect Team
body.new_email=Your confirmation code is {0}\n\nUse it to confirm that this email address is yours and can be the new address of a SportConnect account. It is valid for {1} minutes and works once.\n\nIf you did not ask for this, ignore this email: nothing is changed.\n\nSportConnect Team
