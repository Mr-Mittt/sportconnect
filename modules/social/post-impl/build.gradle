plugins {
    id 'groovy'
}

dependencies {
    // Module dependencies
    implementation project(':modules:social:post-api')
    implementation project(':modules:social:group-api')
    implementation project(':modules:common')
    implementation project(':modules:user:user-api')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Hibernate Spatial for location support
    implementation 'org.hibernate.orm:hibernate-spatial:6.4.1.Final'
    implementation 'org.locationtech.jts:jts-core:1.19.0'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing - Spock Framework
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
    testImplementation 'org.mockito:mockito-core:5.7.0'

    testImplementation 'org.locationtech.jts:jts-core:1.19.0'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}
