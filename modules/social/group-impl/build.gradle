plugins {
    id 'groovy'
}

dependencies {
    // Module dependencies
    implementation project(':modules:social:group-api')
    implementation project(':modules:common')
    implementation project(':modules:user:user-api')
    implementation project(':modules:sport:sport-api')
    implementation project(':modules:social:post-api')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // Redis Streams — publishes domain-change events services/chat (the first non-Java service
    // in this repo) consumes to sync its own authorization cache. See
    // services/chat/docs/SYNC_DESIGN.md.
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // OpenAPI/Swagger annotations for controller documentation — version matches what
    // server's springdoc-openapi-starter-webmvc-ui:2.3.0 resolves (verified, not guessed)
    compileOnly 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.19'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing - Spock Framework
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
    testImplementation 'org.mockito:mockito-core:5.7.0'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}
