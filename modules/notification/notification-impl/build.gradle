plugins {
    id 'groovy'
}

dependencies {
    // Module dependencies
    implementation project(':modules:notification:notification-api')
    implementation project(':modules:common')

    // NTF-2: session-api's 6 event payload DTOs (SESSION-15) + SessionService.getParticipantIdsByStatuses,
    // for the sportconnect.events consumer. Session-only scope for now — post-api/group-api/user-api
    // will each be added once their own outbox-wiring tickets (B7/B21/U13) ship real producers.
    implementation project(':modules:session:session-api')

    // NTF-3: JwtTokenService — validates the JWT carried on a STOMP CONNECT frame. Same
    // cross-domain-via-api-only interface JwtAuthenticationFilter uses internally in auth-impl.
    implementation project(':modules:auth:auth-api')

    // Spring Boot
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // NTF-3: STOMP-over-RabbitMQ live delivery (broker-relay mode). The dependency itself was
    // already present, unused, at server/build.gradle — declared here too since notification-impl
    // is where the STOMP config/interceptor/push classes actually live.
    implementation 'org.springframework.boot:spring-boot-starter-websocket'

    // Spring's StompBrokerRelayMessageHandler uses Reactor Netty's TCP client to connect to the
    // STOMP broker — required on the classpath or the relay bean fails to start with
    // "IllegalStateException: No compatible version of Reactor Netty" (discovered the hard way:
    // it doesn't come transitively from spring-boot-starter-websocket, and its absence broke
    // ApplicationContext startup for every @SpringBootTest in the whole server module, not just
    // this one). Version comes from Spring Boot's own BOM (see root build.gradle), same as every
    // other unversioned Spring dependency in this module.
    implementation 'io.projectreactor.netty:reactor-netty'

    // RabbitMQ client — SessionEventsConsumer (NTF-2) listens on the sportconnect.events exchange;
    // not transitively available from common (declared there as 'implementation', not 'api')
    implementation 'org.springframework.boot:spring-boot-starter-amqp'

    // OpenAPI/Swagger annotations for controller documentation — version matches what
    // server's springdoc-openapi-starter-webmvc-ui:2.3.0 resolves (verified, not guessed)
    compileOnly 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.19'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Testing - Spock Framework
    // Spock's Mock(SessionService) must generate a full mock of the interface, including methods
    // returning post-api's CommentResponse — session-api declares post-api as 'implementation'
    // (not transitive), so it's not on this module's own classpath without this.
    testImplementation project(':modules:social:post-api')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation platform('org.spockframework:spock-bom:2.3-groovy-4.0')
    testImplementation 'org.spockframework:spock-core'
    testImplementation 'org.spockframework:spock-spring'
    testImplementation 'org.apache.groovy:groovy:4.0.15'
    testImplementation 'org.mockito:mockito-core:5.7.0'

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

test {
    useJUnitPlatform()
}
