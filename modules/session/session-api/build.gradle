dependencies {
    // Common module
    implementation project(':modules:common')

    // LocationResponse is embedded directly in SessionResponse
    implementation project(':modules:location:location-api')

    // SESSION-10/A17: CommentResponse/CreateCommentRequest appear directly in SessionService's
    // comment-proxy method signatures (createSessionComment/getSessionComments/...) — same
    // precedent as group-api depending on post-api for PostResponse in GroupResponse/
    // PinnedPostResponse.
    implementation project(':modules:social:post-api')

    // Spring Web
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Spring Data (for Page and Pageable)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}
