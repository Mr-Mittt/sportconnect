plugins {
    id 'base'
    id 'org.springframework.boot' version '3.2.0' apply false
    id 'io.spring.dependency-management' version '1.1.4' apply false
}

group = 'com.sportconnect'
version = '0.0.1-SNAPSHOT'

subprojects {
    // The client is a pnpm/Vite project (see client/build.gradle) — none of
    // the Java/Spring configuration below applies to it
    if (project.name == 'client') {
        return
    }

    apply plugin: 'java'
    
    group = 'com.sportconnect'
    version = '0.0.1-SNAPSHOT'
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }
    
    tasks.withType(JavaCompile) {
        options.compilerArgs << '-parameters'
    }
    
    repositories {
        mavenCentral()
    }
    
    // Apply Spring Boot dependency management to all modules
    apply plugin: 'io.spring.dependency-management'

    dependencyManagement {
        imports {
            mavenBom "org.springframework.boot:spring-boot-dependencies:3.2.0"
        }
    }
}

clean {
    delete rootProject.buildDir
}

build {
    dependsOn ':server:build'
    dependsOn ':client:buildClient'
}

task bootRun {
    dependsOn ':server:bootRun'
    description = 'Start the Spring Boot server'
}
